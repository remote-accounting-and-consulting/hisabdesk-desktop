[package]
name = "hisabdesk"
version = "1.0.0"
description = "HisabDesk - Accounting Consulting Practice Management System"
authors = ["Remote Accounting and Consulting Pvt. Ltd."]
edition = "2021"
rust-version = "1.77.2"
license = "Proprietary"
default-run = "hisabdesk"

[lib]
name = "hisabdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
