name: Release

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write     # needed to create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux ----------
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'linux'

          # ---------- Windows ----------
          - platform: 'windows-latest'
            args: ''
            label: 'windows'

          # ---------- macOS (Intel) ----------
          - platform: 'macos-latest'  # M1 runner, builds universal
            args: '--target universal-apple-darwin'
            label: 'macos'

    runs-on: ${{ matrix.platform }}

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Setup Node ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ---------- Setup Rust ----------
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ---------- Cache Rust build ----------
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---------- Linux system deps ----------
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # ---------- Install npm deps ----------
      - name: Install npm dependencies
        run: npm ci

      # ---------- Generate icons (uses placeholder if none committed) ----------
      - name: Ensure icons exist
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then
            echo "⚠️  No icons found — generating placeholder"
            curl -L -o app-icon.png "https://placehold.co/1024x1024/2563eb/ffffff.png?text=HD"
            npx tauri icon ./app-icon.png
          else
            echo "✅ Icons already present"
          fi

      # ---------- Build Tauri app ----------
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HisabDesk ${{ github.ref_name }}'
          releaseBody: |
            ## HisabDesk ${{ github.ref_name }}

            Accounting Consulting Practice Management System
            For **Remote Accounting and Consulting Pvt. Ltd.**

            ### Downloads

            | Platform | File |
            |----------|------|
            | 🐧 Linux (Debian/Ubuntu) | `HisabDesk_*_amd64.deb` |
            | 🐧 Linux (Fedora/RHEL) | `HisabDesk-*.x86_64.rpm` |
            | 🐧 Linux (Any) | `HisabDesk_*_amd64.AppImage` |
            | 🪟 Windows | `HisabDesk_*_x64_en-US.msi` |
            | 🪟 Windows (portable) | `HisabDesk_*_x64-setup.exe` |
            | 🍎 macOS (Universal) | `HisabDesk_*.dmg` |

            ### Install Notes

            **Linux (.deb):** `sudo dpkg -i HisabDesk_*.deb`
            **Linux (.AppImage):** `chmod +x HisabDesk_*.AppImage && ./HisabDesk_*.AppImage`
            **Windows:** Double-click the `.msi` — no admin rights needed
            **macOS:** Drag to Applications — first launch: right-click → Open (unsigned)

            ### Data Location

            - **Linux:** `~/.config/com.remoteaccounting.hisabdesk/hisabdesk.db`
            - **Windows:** `%APPDATA%\com.remoteaccounting.hisabdesk\hisabdesk.db`
            - **macOS:** `~/Library/Application Support/com.remoteaccounting.hisabdesk/hisabdesk.db`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ---------- Optional: upload artifact even if release fails ----------
      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HisabDesk-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
