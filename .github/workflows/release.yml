name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Ensure icons exist
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then
            curl -L -o app-icon.png "https://placehold.co/1024x1024/2563eb/ffffff.png?text=HD"
            npx tauri icon ./app-icon.png
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HisabDesk ${{ github.ref_name }}'
          releaseBody: |
            ### HisabDesk

            Accounting & Consulting Practice Management System

            ### Installation (for Windows)

            1. Download **HisabDesk-Setup.exe** from the assets below
            2. Double-click the downloaded file to install
            3. Launch **HisabDesk** from the Start menu
          releaseDraft: false
          prerelease: false
