name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Ensure icons exist
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then
            echo "⚠️  No icons found — generating placeholder"
            curl -L -o app-icon.png "https://placehold.co/1024x1024/2563eb/ffffff.png?text=HD"
            npx tauri icon ./app-icon.png
          else
            echo "✅ Icons already present"
          fi

      - name: Build Windows app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HisabDesk ${{ github.ref_name }}'
          releaseBody: |
            ## HisabDesk ${{ github.ref_name }}

            Accounting Consulting Practice Management System
            For **Remote Accounting and Consulting Pvt. Ltd.**

            ### Windows Downloads

            | File | Description |
            |------|-------------|
            | `HisabDesk_*_x64_en-US.msi` | Installer (recommended) |
            | `HisabDesk_*_x64-setup.exe` | NSIS installer (alternative) |

            ### Install

            1. Download the `.msi` file
            2. Double-click to install
            3. Launch **HisabDesk** from the Start menu

            No admin rights needed. WebView2 runtime installs automatically.

            ### Data Location

            `%APPDATA%\com.remoteaccounting.hisabdesk\hisabdesk.db`
          releaseDraft: false
          prerelease: false

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HisabDesk-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
