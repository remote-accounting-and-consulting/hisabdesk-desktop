name: Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Ensure icons exist
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then
            curl -L -o app-icon.png "https://placehold.co/1024x1024/2563eb/ffffff.png?text=HD"
            npx tauri icon ./app-icon.png
          fi

      - run: npm run tauri build

      - name: Rename installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "src-tauri/target/release/bundle/msi/HisabDesk-Setup.msi"
          } else { exit 1 }
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "src-tauri/target/release/bundle/nsis/HisabDesk-Setup.exe"
          }

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'HisabDesk ${{ github.ref_name }}'
          body: |
            **Accounting Consulting Practice Management System**
            From Remote Accounting and Consulting Pvt. Ltd.

            ### Installation (for Windows)

            1. Download **HisabDesk-Setup.msi** (recommended) or **HisabDesk-Setup.exe** from the assets below
            2. Double-click the downloaded file to install
            3. Launch **HisabDesk** from the Start menu
          files: |
            src-tauri/target/release/bundle/msi/HisabDesk-Setup.msi
            src-tauri/target/release/bundle/nsis/HisabDesk-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HisabDesk-Windows-Backup
          path: |
            src-tauri/target/release/bundle/msi/HisabDesk-Setup.msi
            src-tauri/target/release/bundle/nsis/HisabDesk-Setup.exe
          if-no-files-found: warn
